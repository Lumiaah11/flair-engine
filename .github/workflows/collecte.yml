name: Collecte Flair

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "engine/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      seule:
        description: "Tester une seule entreprise (nom exact), vide pour tout"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collecte
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer
        run: pip install -r requirements.txt

      - name: Tests hors ligne
        run: python -m unittest discover -s tests -v

      - name: Collecter
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
        run: |
          if [ -n "${{ github.event.inputs.seule }}" ]; then
            python -m engine.main --seule "${{ github.event.inputs.seule }}"
          else
            python -m engine.main
          fi

      - name: Enregistrer les résultats
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.seule == '' }}
        run: |
          git config user.name "flair-bot"
          git config user.email "flair-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "Collecte du $(date -u +%F)"
          git push
